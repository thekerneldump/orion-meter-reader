services:
  orion-meter-reader:
    build:
      context: .
      args:
        APP_VERSION: "0.0.1"
        RTL433_VERSION: "25.12"
    image: orion-meter-reader:0.0.1
    container_name: orion-meter-reader
    restart: unless-stopped
    init: true
    environment:
      SDR_SERIAL: "${SDR_SERIAL:?Set SDR_SERIAL in .env to the Orion dongle serial}"
      METER_IDS: "${METER_IDS:-}"
      FREQUENCY: "${FREQUENCY:-905.2M}"
      SAMPLE_RATE: "${SAMPLE_RATE:-1600k}"
      GAIN: "${GAIN:-0}"
      RTL433_EXTRA_ARGS: "${RTL433_EXTRA_ARGS:--f 906.8M -f 908.4M -f 910.0M -f 911.6M -f 913.2M -f 914.8M -f 916.4M -f 918.0M -f 919.6M -f 921.2M -f 922.8M -f 924.4M -H 5}"
      AUTO_RECENTER_ENABLED: "${AUTO_RECENTER_ENABLED:-false}"
      AUTO_RECENTER_THRESHOLD_MHZ: "${AUTO_RECENTER_THRESHOLD_MHZ:-0.35}"
      AUTO_RECENTER_MIN_PACKETS: "${AUTO_RECENTER_MIN_PACKETS:-5}"
      AUTO_RECENTER_WINDOW_SECONDS: "${AUTO_RECENTER_WINDOW_SECONDS:-300}"
      AUTO_RECENTER_COOLDOWN_SECONDS: "${AUTO_RECENTER_COOLDOWN_SECONDS:-900}"
      MAX_JSONL_BYTES: "${MAX_JSONL_BYTES:-104857600}"
      JSONL_ROTATE_COUNT: "${JSONL_ROTATE_COUNT:-4}"
      RADIO_CONTROL_TOKEN: "${RADIO_CONTROL_TOKEN:-}"
      RADIO_CONTROL_SERIALS: "${RADIO_CONTROL_SERIALS:-}"
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8083}:8083"
    volumes:
      - ./data:/data
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rwm"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
